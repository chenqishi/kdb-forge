[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --import-mode=importlib -p no:cacheprovider -m "not requires_process"
markers =
    requires_process: original test requires a real child process; excluded by the mandatory offline boundary
    llm: requires a remote LLM; unavailable in offline validation
    integration: 需要真实 ES/OpenSearch + DashScope embedding 的集成测试
