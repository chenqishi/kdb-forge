[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kdb"
version = "0.1.0"
description = "Unified knowledge project: mining, retrieval and shared services."
requires-python = ">=3.9"
dependencies = [
    "elasticsearch>=8.17,<8.18",
    "fastapi>=0.100",
    "pydantic>=2,<3",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
